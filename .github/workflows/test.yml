name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16 (Swift 6)
        run: |
          XCODE="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          swift --version

      - name: Verify Swift 6 toolchain
        run: swift --version 2>&1 | grep -Eq 'Swift version (6|[7-9])' || { echo "::error::LinkIO 2.x requires a Swift 6 toolchain"; exit 1; }

      - name: Build for iOS
        run: xcodebuild -scheme LinkIO -sdk iphoneos -destination 'generic/platform=iOS' build CODE_SIGNING_ALLOWED=NO

      - name: Verify Swift Package
        run: swift package resolve
